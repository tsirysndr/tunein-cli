name: FluentCI PureScript toolchain
description: Bootstrap the published PureScript toolchain and the local typed CI component.
runs:
  using: composite
  steps:
    - name: Cache versioned compiler tools and package downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/fluentci/node/24.22.2
          ~/.local/share/fluentci/bun/1.4.3
          ~/.local/share/fluentci/purescript/0.15.16
          ~/.cache/spago
          ~/Library/Caches/spago
        key: tunein-fluentci-v1-${{ runner.os }}-${{ runner.arch }}-node24.22.2-bun1.4.3-purs0.15.16-spago1.0.5
    - name: Install published PureScript, Node and Bun toolchain
      shell: bash
      run: fluentci run --frozen-lockfile setup-purescript setup --version 0.15.16 --node-version 24.22.2 --bun-version 1.4.3 --spago-version 1.0.5 --npm-version 10.9.2
    - name: Prepare the SDK and component
      shell: bash
      run: node .fluentci/ci/bootstrap.mjs
