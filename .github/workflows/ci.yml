name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: bash .dagger/install-dagger.sh

      - name: Run PureScript Dagger pipeline
        uses: ./.github/actions/dagger
        env:
          CI: "true"
        with:
          module: ci
          key: test
          volumes: tunein-cli-cargo-registry,tunein-cli-cargo-git,tunein-cli-target-test,tunein-cli-bun
          command: |
            dagger api call -m ci test --source ..
