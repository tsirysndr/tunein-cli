name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Workflow validation
        run: fluentci run ci check --directory "$GITHUB_WORKSPACE"
      - name: PureScript policy regression tests
        working-directory: .fluentci/ci
        run: npm test
      - name: Rust formatting
        run: fluentci run ci format --source "$GITHUB_WORKSPACE"
      - name: Web and Rust tests
        run: fluentci run ci test --source "$GITHUB_WORKSPACE"
        env:
          CI: "true"
