name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Run native PureScript CI
        env:
          CI: "true"
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci test --source "$GITHUB_WORKSPACE/.dagger/.."
    defaults:
      run:
        shell: bash
