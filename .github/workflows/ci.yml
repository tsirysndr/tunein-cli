name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Run PureScript Dagger pipeline
        uses: ./.github/actions/dagger
        env:
          CI: "true"
        with:
          module: ci
          key: test
          volumes: tunein-cli-cargo-registry,tunein-cli-cargo-git,tunein-cli-target-test,tunein-cli-bun
          command: |
            dagger api call -m ci test --source ..
