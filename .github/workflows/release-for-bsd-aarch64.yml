name: BSD release aarch64
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string
permissions:
  contents: write
jobs:
  freebsd:
    name: aarch64-unknown-freebsd
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      GUEST_SOURCE_DIRECTORY: .fluentci/source
      ASSET_TARGET: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Select tagged application source
        run: fluentci run ci checkout-release
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
      - name: Build embedded web UI
        run: fluentci run ci web --source "$SOURCE_DIRECTORY"
      - name: Build in freebsd using compiled PureScript
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: aarch64
          usesh: true
          envs: RELEASE_VERSION ASSET_TARGET GUEST_SOURCE_DIRECTORY
          prepare: pkg install -y node
          run: node .fluentci/ci/dist/bsd-guest.cjs
      - name: Upload release assets
        run: fluentci run ci github-assets --directory "$SOURCE_DIRECTORY/.fluentci/out/$ASSET_TARGET" --tag "$RELEASE_VERSION" --create
        env:
          GH_TOKEN: ${{ github.token }}
  netbsd:
    name: aarch64-unknown-netbsd
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      GUEST_SOURCE_DIRECTORY: .fluentci/source
      ASSET_TARGET: aarch64-unknown-netbsd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Select tagged application source
        run: fluentci run ci checkout-release
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
      - name: Build embedded web UI
        run: fluentci run ci web --source "$SOURCE_DIRECTORY"
      - name: Build in netbsd using compiled PureScript
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          arch: aarch64
          usesh: true
          envs: RELEASE_VERSION ASSET_TARGET GUEST_SOURCE_DIRECTORY
          prepare: /usr/sbin/pkg_add nodejs
          run: /usr/pkg/bin/node .fluentci/ci/dist/bsd-guest.cjs
      - name: Upload release assets
        run: fluentci run ci github-assets --directory "$SOURCE_DIRECTORY/.fluentci/out/$ASSET_TARGET" --tag "$RELEASE_VERSION" --create
        env:
          GH_TOKEN: ${{ github.token }}
