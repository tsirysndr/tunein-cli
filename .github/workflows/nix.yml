name: Nix build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Build the locked flake and push its result when authenticated
        run: fluentci run ci nix-build --source "$GITHUB_WORKSPACE" --cache tsirysndr
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
