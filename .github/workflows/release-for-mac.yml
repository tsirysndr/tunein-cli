name: macOS release
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Select tagged application source
        run: fluentci run ci checkout-release
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
      - name: Build and upload macOS release
        run: fluentci run ci macos-release-from-env
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
