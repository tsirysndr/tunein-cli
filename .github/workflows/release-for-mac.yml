on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets to (e.g. v0.7.0)"
        required: true
        type: string

jobs:
  release:
    name: release x86_64-apple-darwin
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - name: Installing needed dependencies
        run: brew install protobuf llvm@15
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable --targets '${{ matrix.target }}' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Checking out sources
        uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Running cargo build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Install aarch64-apple-darwin toolchain
        if: matrix.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin
      - name: Set env
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi
      - name: Packaging final binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../tunein_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz tunein
          shasum -a 256 ../../../tunein_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz > ../../../tunein_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz.sha256
          cd ../../../ && rm -rf target
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            tunein_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz
            tunein_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
