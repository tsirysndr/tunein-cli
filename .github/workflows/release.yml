name: Linux release
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, x86_64-unknown-linux-gnu]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.github/actions/fluentci-toolchain
      - name: Select tagged application source
        run: fluentci run ci checkout-release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Build, package and publish using typed components
        run: fluentci run ci linux-release-from-env
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
