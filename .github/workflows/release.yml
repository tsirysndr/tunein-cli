name: release
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Run PureScript Dagger pipeline
        uses: ./.github/actions/dagger
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        with:
          module: ci
          key: release-${{ matrix.target }}
          volumes: tunein-cli-cargo-registry,tunein-cli-cargo-git,tunein-cli-target-${{ matrix.target }},tunein-cli-bun
          command: |
            dagger --progress logs -v api call -m ci linux-release --source .. --target "$TARGET" --version "$VERSION" --output ../dist

      - name: Upload release with Dagger
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger --progress logs -v api call -m ci upload-release --assets ../dist --tag "$RELEASE_TAG" --token env://GH_TOKEN --run-id "$WORKFLOW_RUN"

      - name: Publish packages with Dagger
        working-directory: .dagger
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger --progress logs -v api call -m ci publish-gemfury --assets ../dist --account env://FURY_ACCOUNT --token env://FURY_TOKEN --run-id "$WORKFLOW_RUN"
