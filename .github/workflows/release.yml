name: Linux release
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, x86_64-unknown-linux-gnu]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Build, package and publish using typed components
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci linux-release-from-env
        env:
          SOURCE_DIRECTORY: ${{ github.workspace }}
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
