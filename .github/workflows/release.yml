name: release
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: bash .dagger/install-dagger.sh

      - name: Run PureScript Dagger pipeline
        uses: ./.github/actions/dagger
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        with:
          module: ci
          key: release-${{ matrix.target }}
          volumes: tunein-cli-cargo-registry,tunein-cli-cargo-git,tunein-cli-target-${{ matrix.target }},tunein-cli-bun
          command: |
            dagger api call -m ci linux-release --source .. --target "$TARGET" --version "$VERSION" --output ../dist

      - name: Upload release with Dagger
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ci upload-release --assets ../dist --tag "$RELEASE_TAG" --token env://GH_TOKEN --run-id "$WORKFLOW_RUN"

      - name: Check Gemfury secrets
        id: gemfury
        if: matrix.target != 'armv7-unknown-linux-gnueabihf'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping push"
          fi

      - name: Publish packages with Dagger
        if: matrix.target != 'armv7-unknown-linux-gnueabihf' && steps.gemfury.outputs.available == 'true'
        working-directory: .dagger
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ci publish-gemfury --assets ../dist --account env://FURY_ACCOUNT --token env://FURY_TOKEN --run-id "$WORKFLOW_RUN"
