name: BSD release x86_64
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string
permissions:
  contents: write
jobs:
  freebsd:
    name: x86_64-unknown-freebsd
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      ASSET_TARGET: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Build embedded web UI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci web --source "$GITHUB_WORKSPACE"
      - name: Build in freebsd using compiled PureScript
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          envs: RELEASE_VERSION ASSET_TARGET
          prepare: pkg install -y node
          run: node .ci-tooling/.fluentci/ci/dist/bsd-guest.cjs
      - name: Upload release assets
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci github-assets --directory "$GITHUB_WORKSPACE/.fluentci/out/$ASSET_TARGET" --tag "$RELEASE_VERSION" --create
        env:
          GH_TOKEN: ${{ github.token }}
  netbsd:
    name: x86_64-unknown-netbsd
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      ASSET_TARGET: x86_64-unknown-netbsd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Build embedded web UI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci web --source "$GITHUB_WORKSPACE"
      - name: Build in netbsd using compiled PureScript
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          arch: x86_64
          usesh: true
          envs: RELEASE_VERSION ASSET_TARGET
          prepare: /usr/sbin/pkg_add nodejs
          run: /usr/pkg/bin/node .ci-tooling/.fluentci/ci/dist/bsd-guest.cjs
      - name: Upload release assets
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci github-assets --directory "$GITHUB_WORKSPACE/.fluentci/out/$ASSET_TARGET" --tag "$RELEASE_VERSION" --create
        env:
          GH_TOKEN: ${{ github.token }}
