name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: bash .dagger/install-dagger.sh

      - name: Check formatting with Dagger
        working-directory: .dagger
        run: dagger api call -m ci format --source ..
